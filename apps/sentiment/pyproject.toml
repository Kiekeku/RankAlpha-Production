[project]
name = "sentiment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
   "anthropic>=0.57.1",
   "jsonschema==4.20.0",
   "jsonschema-specifications>=2023.5.0,<2023.8.0",
   "mcp-agent>=0.1.6",
   "openai>=1.93.1",
   "openai-agents>=0.1.0",
   "pdfminer-six>=20250506",
   "playwright>=1.54.0",
   # Use prebuilt wheels to avoid local compilation issues on Ubuntu
   "psycopg2-binary==2.9.10",
   "pymupdf4llm>=0.0.27",
   "pytest>=8.4.2",
   "pytest-asyncio>=0.23.0",
   "ruff>=0.12.5",
   "mypy>=1.17.0",
   "redis>=5.0.0",
   "serper-mcp-server>=0.0.8",
   "prometheus-client>=0.20.0",
   "opentelemetry-sdk>=1.28.2",
   "opentelemetry-exporter-otlp-proto-grpc>=1.28.2",
   "opentelemetry-exporter-otlp-proto-http>=1.28.2",
   "opentelemetry-instrumentation-logging>=0.49b0",
   "opentelemetry-instrumentation-requests>=0.49b0",
   "opentelemetry-instrumentation-psycopg2>=0.49b0",
   "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
   "opentelemetry-api>=1.37.0",
   "sentry-sdk>=2.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    ".venv-tools",
    ".uv-cache",
    "node_modules",
    "tests/.venv",
    "apps/sentiment/ext",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
explicit_package_bases = true
disable_error_code = [
   "arg-type",
   "assignment",
   "attr-defined",
   "call-arg",
   "has-type",
   "import-untyped",
   "index",
   "misc",
   "no-redef",
   "operator",
   "var-annotated",
]
