[project]
name = "common"
version = "0.1.0"
description = "Shared utilities for RankAlpha apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "ruff>=0.12.5",
    "mypy>=1.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    ".venv-tools",
    ".uv-cache",
    "node_modules",
    "tests/.venv",
    "apps/sentiment/ext",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
explicit_package_bases = true
exclude = "src/models\\.py$"
disable_error_code = [
    "assignment",
    "misc",
    "valid-type",
]
