[project]
name = "newswire"
version = "0.1.0"
description = "RankAlpha news collector, deduper, and prefilter (TF‑IDF first pass)"
requires-python = ">=3.12"

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.10",
  "python-dateutil>=2.9",
  "scikit-learn>=1.4",
  "joblib>=1.4",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "tldextract>=5.1",
  "url-normalize>=1.4",
  "rapidfuzz>=3.9",
  "sqlalchemy>=2.0.41",
  "psycopg2-binary>=2.9.9",
  "common",
  "openai>=1.40.0",
  "trafilatura>=1.7.0",
  "feedparser>=6.0.10",
  "ruff>=0.12.5",
  "mypy>=1.17.0",
]

[dependency-groups]
dev = [
  "pytest",
]

[tool.uv.sources]
common = { path = "../common", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    ".venv-tools",
    ".uv-cache",
    "node_modules",
    "tests/.venv",
    "apps/sentiment/ext",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
no_implicit_optional = false
explicit_package_bases = true
disable_error_code = [
    "attr-defined",
    "misc",
    "operator",
]
