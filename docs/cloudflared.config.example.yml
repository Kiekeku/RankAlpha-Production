# Example Cloudflared configuration for RankAlpha
# Copy to /etc/cloudflared/config.yml and edit values.

################################################################################
# Tunnel
################################################################################
tunnel: <your-tunnel-uuid>
credentials-file: /etc/cloudflared/<your-tunnel-uuid>.json

################################################################################
# Ingress rules
################################################################################
ingress:
  # Frontend only — served from local loopback. Replace the hostname.
  - hostname: your.cloudflare.domain
    service: http://localhost:3000

  # Optional: healthcheck route (served locally)
  - hostname: status.your.cloudflare.domain
    service: http://localhost:3000/_health

  # Default catch‑all to avoid accidental exposure
  - service: http_status:404

################################################################################
# Optional: origin request and connection settings
################################################################################
originRequest:
  noTLSVerify: true           # Next.js runs plain HTTP locally
  http2Origin: true

metrics: 127.0.0.1:43191      # Prometheus‑style metrics on loopback only

# Notes:
# - Do NOT route the API, database, Redis, Airflow, RabbitMQ, or SFTP here.
# - If you must expose additional routes, use Cloudflare Access policies.
